    <div id="thumbField">
      <div id="thumbSlotWrap">
        <button type="button" id="addThumbBtn">Add a preview image</button>
        <img id="thumbSlotImg" src="drop-placeholder.webp" alt="" width="240" height="135">
      </div>
      <div id="thumbSlotSide">
        <p class="hint" id="thumbEmptyHint">Paste a screenshot or choose an image. Drag and zoom to frame your blueprint.</p>
        <p class="hint" id="thumbReadyMsg" hidden>Preview ready &mdash; this is what other players will see. <a href="#" id="thumbDownloadLink" download="preview.webp">Download this WebP</a></p>
        <p class="hint" id="thumbReadyError" hidden></p>
        <div id="thumbReadyActions" hidden>
          <button type="button" id="changeThumbBtn">Change image</button>
          <button type="button" id="removeThumbBtn">Remove image</button>
        </div>
      </div>
    </div>
